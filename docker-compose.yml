

version: '3.8'

services:
  # ১. লোকাল ডাটাবেজ সার্ভিস
  postgres:
    image: postgres:16-alpine
    container_name: event_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: event_management_db
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ২. ব্যাকএন্ড সার্ভিস
  backend:
    build: .
    container_name: event_backend
    restart: always
    ports:
      - "5001:5000"
    env_file:
      - .env   # এটি আপনার .env ফাইলের Stripe, JWT ইত্যাদি সব নিজ থেকেই নিয়ে নিবে
    environment:
      # শুধু ডাটাবেজ ইউআরএলটা ডকারের লোকাল পোস্টগ্রেসের সাথে ওভাররাইড হবে
      DATABASE_URL: "postgresql://postgres:rootpassword@postgres:5432/event_management_db?schema=public"
      PORT: 5000
    depends_on:
      - postgres

volumes:
  pgdata:
